name: Update formula

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  formula:
    name: Regenerate from the latest release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: michel/soulseek-rs
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::unexpected tag: $tag"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"

          base="https://github.com/$REPO/releases/download/$tag"
          sha() {
            local value
            value=$(gh release download "$tag" --repo "$REPO" \
              --pattern "soulseek-rs-$tag-$1.sha256" --output - | cut -d' ' -f1)
            [[ "$value" =~ ^[0-9a-f]{64}$ ]] || {
              echo "::error::no usable sha256 for $1 at $tag - the release is probably still uploading"
              return 1
            }
            printf '%s' "$value"
          }

          # Hoisted out of the heredoc deliberately. A failing command
          # substitution *inside* a heredoc does not trip `set -e` - the
          # redirection still succeeds - so interpolating sha() directly would
          # publish `sha256 ""` and break `brew install` for everyone. As an
          # assignment the same failure aborts the run, and the next poll (or
          # the release's own dispatch) regenerates once the uploads land.
          mac_arm=$(sha aarch64-apple-darwin)
          mac_intel=$(sha x86_64-apple-darwin)
          linux_arm=$(sha aarch64-unknown-linux-musl)
          linux_intel=$(sha x86_64-unknown-linux-musl)

          mkdir -p Formula
          cat > Formula/soulseek-rs.rb <<EOF
          # Generated by the Update formula workflow. Do not edit by hand.
          class SoulseekRs < Formula
            desc "Soulseek client in Rust"
            homepage "https://re-invention.nl/soulseek-rs/"
            version "${tag#v}"
            license "MIT"

            on_macos do
              on_arm do
                url "$base/soulseek-rs-$tag-aarch64-apple-darwin.tar.gz"
                sha256 "$mac_arm"
              end
              on_intel do
                url "$base/soulseek-rs-$tag-x86_64-apple-darwin.tar.gz"
                sha256 "$mac_intel"
              end
            end

            on_linux do
              on_arm do
                url "$base/soulseek-rs-$tag-aarch64-unknown-linux-musl.tar.gz"
                sha256 "$linux_arm"
              end
              on_intel do
                url "$base/soulseek-rs-$tag-x86_64-unknown-linux-musl.tar.gz"
                sha256 "$linux_intel"
              end
            end

            def install
              bin.install "soulseek-rs"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/soulseek-rs --version")
            end
          end
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/soulseek-rs.rb
          git diff --staged --quiet || { git commit -m "soulseek-rs $TAG"; git push; }
